---
# Overrides for the AWS c7a.metal-48xl benchmark host (2 x EPYC 9R14, 96 cores / 192 threads).
# Inventory group_vars beat the playbook's group_vars/all.yml.

# AWS numbers SMT siblings as (i, i+96). The guide's BIOS table disables SMT; on
# EC2 metal there is no BIOS access, so nosmt on the kernel cmdline is the
# equivalent and leaves CPUs 0-95 online after reboot.
amd_low_latency_tuned_cmdline_extra:
  - nosmt

# One CCD's worth of cores on socket 0 (Genoa: 8 cores per CCD). Confirm with
# `lscpu -e=CPU,CORE,SOCKET,NODE,CACHE` in the benchmark's context.txt and
# adjust so the isolated set shares one L3.
isolated_cores: "8-15"
no_balance_cores: "{{ isolated_cores }}"
hk_cpus: "0-7,16-95"

# Full guide profile; reboot as part of the tuning run so the benchmark script
# can continue unattended.
amd_low_latency_enabled: true
amd_low_latency_tuned_profile_enabled: true
amd_low_latency_irqbalance_oneshot: true
amd_low_latency_reboot_after_apply: true

# Keep the measurement to what the guide prescribes; the legacy pin scripts
# target eth0 IRQs which don't exist on ENA anyway.
housekeeping_enabled: false

# sysjitter defaults for test/benchmark.yml and verify-tuning.yml
sysjitter_threshold_ns: 300
sysjitter_cores: "{{ isolated_cores }}"
