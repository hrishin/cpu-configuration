---
- name: Configure kernel boot arguments, sysctl, and housekeeping service
  hosts: all
  become: yes
  gather_facts: yes
  # Variables can be overridden via group_vars or passed via -e
  # See group_vars/all.yml for default configuration and enable/disable flags
  
  tasks:
    - name: Install dependencies (libbpf-tools, bpftrace, trace-cmd, sysjitter)
      include_role:
        name: install-dependencies
      when: install_dependencies_enabled | default(true) | bool

    - name: Configure housekeeping (kernel boot args, sysctl, scripts, service)
      include_role:
        name: configure-housekeeping
      when: configure_housekeeping_enabled | default(true) | bool

