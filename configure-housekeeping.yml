---
- name: Configure AMD EPYC low-latency tuning (tuned profile, irqbalance, housekeeping)
  hosts: all
  become: yes
  gather_facts: yes
  # Variables can be overridden via group_vars or passed via -e
  # See group_vars/all.yml for default configuration and enable/disable flags

  tasks:
    - name: Install dependencies (libbpf-tools, bpftrace, trace-cmd, perf, sysjitter)
      include_role:
        name: install-dependencies
      when: install_dependencies_enabled | default(true) | bool

    - name: Configure AMD low latency (tuned CPU partitioning profile, irqbalance, cpufreq, resctrl)
      include_role:
        name: configure-amd-low-latency
      when: configure_amd_low_latency_enabled | default(true) | bool

    - name: Configure housekeeping (legacy grubby boot args, sysctl.d, pin scripts, service)
      include_role:
        name: configure-housekeeping
      when: configure_housekeeping_enabled | default(true) | bool
