---
# Kernel Boot Arguments Configuration
- name: Get current default kernel args from grubby
  command: grubby --info=DEFAULT
  register: current_default_args
  changed_when: false
  failed_when: false
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - ansible_facts["os_family"] == "RedHat"

- name: Extract existing args from default kernel
  set_fact:
    existing_default_args_raw: "{{ current_default_args.stdout | regex_search('args=\"([^\"]+)\"', '\\1') | default('') }}"
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - ansible_facts["os_family"] == "RedHat"
    - current_default_args is defined

- name: Use provided boot args if explicitly specified
  set_fact:
    current_boot_args: "{{ kernel_boot_args }}"
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - kernel_boot_args != ""

- name: Merge existing grubby args with default boot params
  set_fact:
    current_boot_args: "{{ existing_default_args_raw | default('') }} {{ default_boot_params | default('') }}"
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - kernel_boot_args == ""
    - ansible_facts["os_family"] == "RedHat"
    - existing_default_args_raw is defined

- name: Use default boot params only if no existing args found
  set_fact:
    current_boot_args: "{{ default_boot_params }}"
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - kernel_boot_args == ""
    - current_boot_args is not defined or current_boot_args == ""

- name: Clean up merged boot args (remove extra spaces)
  set_fact:
    current_boot_args: "{{ current_boot_args | trim | regex_replace('\\s+', ' ') }}"
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - current_boot_args is defined

- name: Display boot arguments to apply
  debug:
    msg: "Kernel boot parameters to apply: {{ current_boot_args }}"
  when: configure_housekeeping_kernel_boot_args | default(true) | bool

- name: Apply kernel boot arguments to default kernel using grubby
  shell: |
    grubby --update-kernel=DEFAULT --args="{{ current_boot_args }}"
  register: grubby_default_result
  changed_when: true
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - ansible_facts["os_family"] == "RedHat"
    - current_boot_args is defined
    - current_boot_args | trim | length > 0

- name: Apply kernel boot arguments to all kernels using grubby
  shell: |
    grubby --update-kernel=ALL --args="{{ current_boot_args }}"
  register: grubby_all_result
  changed_when: true
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - ansible_facts["os_family"] == "RedHat"
    - current_boot_args is defined
    - current_boot_args | trim | length > 0

- name: Verify grubby update results
  debug:
    msg: |
      Default kernel update: {{ grubby_default_result.stdout | default('N/A') }}
      All kernels update: {{ grubby_all_result.stdout | default('N/A') }}
  when: 
    - configure_housekeeping_kernel_boot_args | default(true) | bool
    - ansible_facts["os_family"] == "RedHat"
    - grubby_default_result is defined or grubby_all_result is defined

# Sysctl Configuration
- name: Determine which sysctl settings to use
  set_fact:
    final_sysctl_settings: "{{ sysctl_settings if sysctl_settings | length > 0 else default_sysctl_settings }}"
  when: configure_housekeeping_sysctl | default(true) | bool

- name: Display sysctl settings to apply
  debug:
    msg: "Applying sysctl settings: {{ final_sysctl_settings }}"
  when: configure_housekeeping_sysctl | default(true) | bool

- name: Apply sysctl settings
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    state: present
    sysctl_set: yes
    reload: yes
  loop: "{{ final_sysctl_settings | dict2items }}"
  when: configure_housekeeping_sysctl | default(true) | bool

- name: Save sysctl settings to /etc/sysctl.d/99-housekeeping.conf
  copy:
    content: |
      # Sysctl settings for housekeeping CPUs
      {% for key, value in final_sysctl_settings.items() %}
      {{ key }} = {{ value }}
      {% endfor %}
    dest: /etc/sysctl.d/99-housekeeping.conf
    mode: '0644'
    owner: root
    group: root
  when: configure_housekeeping_sysctl | default(true) | bool

- name: Verify sysctl settings file
  command: sysctl -p /etc/sysctl.d/99-housekeeping.conf
  register: sysctl_verify_result
  changed_when: false
  failed_when: false
  when: configure_housekeeping_sysctl | default(true) | bool

# Scripts Deployment
- name: Ensure /usr/local/sbin directory exists
  file:
    path: /usr/local/sbin
    state: directory
    mode: '0755'
  when: configure_housekeeping_scripts | default(true) | bool

- name: Deploy pin_housekeeping.sh script
  template:
    src: pin_housekeeping.sh.j2
    dest: "{{ pin_housekeeping_script_path }}"
    mode: '0755'
    owner: root
    group: root
  when: configure_housekeeping_scripts | default(true) | bool

- name: Deploy set_irq_affinity.sh script
  template:
    src: set_irq_affinity.sh.j2
    dest: "{{ set_irq_affinity_script_path }}"
    mode: '0755'
    owner: root
    group: root
  when: configure_housekeeping_scripts | default(true) | bool

- name: Deploy trace_jitter.sh script
  template:
    src: trace_jitter.sh.j2
    dest: "{{ trace_jitter_script_path }}"
    mode: '0755'
    owner: root
    group: root
  when: configure_housekeeping_scripts | default(true) | bool

# Systemd Service Deployment
- name: Deploy pin-housekeeping.service
  template:
    src: pin-housekeeping.service.j2
    dest: "{{ systemd_service_path }}"
    mode: '0644'
    owner: root
    group: root
  notify: reload systemd
  when: configure_housekeeping_service | default(true) | bool

- name: Enable and start pin-housekeeping service
  systemd:
    name: pin-housekeeping
    enabled: yes
    state: started
    daemon_reload: yes
  when: configure_housekeeping_service | default(true) | bool
