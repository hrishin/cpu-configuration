---
# Section 2.4: with amd_pstate=passive, steer housekeeping cores to lower
# frequencies (or pin governors) using cpupower.

- name: Install kernel-tools (cpupower)
  package:
    name: kernel-tools
    state: present
  when: amd_cpufreq_profiles | length > 0

- name: Deploy amd_cpufreq.sh
  template:
    src: amd_cpufreq.sh.j2
    dest: "{{ amd_cpufreq_script_path }}"
    mode: '0755'
    owner: root
    group: root
  when: amd_cpufreq_profiles | length > 0

- name: Deploy amd-cpufreq.service
  template:
    src: amd-cpufreq.service.j2
    dest: "{{ amd_cpufreq_service_path }}"
    mode: '0644'
    owner: root
    group: root
  notify: reload systemd
  when: amd_cpufreq_profiles | length > 0

- name: Flush handlers so the unit is visible
  meta: flush_handlers

- name: Enable and start amd-cpufreq.service
  systemd:
    name: amd-cpufreq
    enabled: yes
    state: started
    daemon_reload: yes
  when: amd_cpufreq_profiles | length > 0

- name: Check for a stale amd-cpufreq.service
  stat:
    path: "{{ amd_cpufreq_service_path }}"
  register: amd_cpufreq_service_stat
  when: amd_cpufreq_profiles | length == 0

- name: Disable amd-cpufreq.service when no profiles are configured
  systemd:
    name: amd-cpufreq
    enabled: no
    state: stopped
  when:
    - amd_cpufreq_profiles | length == 0
    - amd_cpufreq_service_stat.stat.exists

- name: Remove amd-cpufreq files when no profiles are configured
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ amd_cpufreq_service_path }}"
    - "{{ amd_cpufreq_script_path }}"
  notify: reload systemd
  when: amd_cpufreq_profiles | length == 0
