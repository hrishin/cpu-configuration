---
# AMD EPYC 9005 low-latency tuning (AMD pub 73314).
# Each component is guarded by its own flag; see defaults/main.yml.

- name: Assert isolated_cores is set
  assert:
    that:
      - isolated_cores is defined
      - isolated_cores | string | length > 0
    fail_msg: "isolated_cores must be set (e.g. '2-11,14-23') so the tuned profile can isolate CPUs"

- name: Deploy and activate the AMD tuned CPU partitioning profile
  include_tasks: tuned.yml
  when: amd_tuned_profile_enabled | bool

- name: Configure irqbalance in oneshot mode
  include_tasks: irqbalance.yml
  when: amd_irqbalance_oneshot | bool

- name: Configure Solarflare adapter options
  include_tasks: solarflare.yml
  when: amd_solarflare_affinity_enabled | bool or amd_solarflare_rss_cpus | string | length > 0

- name: Configure per-core CPU frequency limits (cpupower)
  include_tasks: cpufreq.yml

- name: Configure L3 cache allocation (resctrl)
  include_tasks: resctrl.yml

- name: Reboot to apply kernel command line changes
  reboot:
    msg: "Rebooting to apply AMD low-latency kernel parameters"
    reboot_timeout: 600
  when:
    - amd_reboot_after_apply | bool
    - amd_tuned_profile_enabled | bool
    - (amd_tuned_profile_applied is defined and amd_tuned_profile_applied is changed)
      or (amd_tuned_bls_patch is defined and amd_tuned_bls_patch is changed)
    - ansible_connection | default('ssh') != 'local'
