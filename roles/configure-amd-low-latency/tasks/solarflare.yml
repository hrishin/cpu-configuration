---
# Section 3.4 / Chapter 4: Solarflare X4 RSS and IRQ affinity.
# sfcaffinity_config itself is invoked from the tuned profile script.sh.

- name: Check for sfcaffinity_config
  stat:
    path: "{{ amd_solarflare_sfcaffinity_bin }}"
  register: amd_sfcaffinity_bin
  when: amd_solarflare_affinity_enabled | bool

- name: Warn if sfcaffinity_config is missing
  debug:
    msg: "{{ amd_solarflare_sfcaffinity_bin }} not found; install Onload/sfutils. The tuned script will skip IRQ steering until it exists."
  when:
    - amd_solarflare_affinity_enabled | bool
    - not amd_sfcaffinity_bin.stat.exists

- name: Set sfc RSS channel count via modprobe
  copy:
    content: |
      # {{ ansible_managed }}
      # Reduce RSS channels; tune to your kernel vs Onload/TCPDirect/ef_vi traffic mix.
      options sfc rss_cpus={{ amd_solarflare_rss_cpus }}
    dest: /etc/modprobe.d/sfc-rss.conf
    mode: '0644'
    owner: root
    group: root
  when: amd_solarflare_rss_cpus | string | length > 0

- name: Remove sfc RSS modprobe override when unset
  file:
    path: /etc/modprobe.d/sfc-rss.conf
    state: absent
  when: amd_solarflare_rss_cpus | string | length == 0
