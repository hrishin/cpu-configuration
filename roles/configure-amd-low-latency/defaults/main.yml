---
# Defaults for the configure-amd-low-latency role.
# Source: "Low Latency Tuning for AMD EPYC 9005 CPU Powered Servers" (AMD pub 73314, rev 1.0).
# Override any of these in group_vars/ or with -e.

# --- Component flags -------------------------------------------------------
amd_tuned_profile_enabled: true        # Chapter 3: deploy + activate the tuned profile
amd_irqbalance_oneshot: true           # Section 3.4: run irqbalance once, then leave IRQs alone
amd_solarflare_affinity_enabled: false # Section 3.4: call sfcaffinity_config from the tuned script agent
amd_cpufreq_profiles: []               # Section 2.4: per-core frequency caps via cpupower (amd_pstate=passive)
amd_resctrl_groups: []                 # Section 2.6: L3 Cache Allocation Technology via resctrl
amd_reboot_after_apply: false          # Kernel cmdline changes need a reboot; opt-in only

# --- CPU layout (single source of truth) -----------------------------------
# isolated_cores feeds isolcpus/nohz_full/rcu_nocbs through the tuned profile.
# Keep isolated cores inside one CCD/NUMA node next to the NIC (Section 2.2).
isolated_cores: "2-11,14-23"
# no_balance_cores adds the isolcpus=nohz,managed_irq,domain,<cores> argument.
# Defaults to the same set as isolated_cores; set to "" to leave the scheduler
# domains intact (isolation via nohz_full/rcu_nocbs only).
no_balance_cores: "{{ isolated_cores }}"

# --- Packages --------------------------------------------------------------
amd_tuned_packages:
  - tuned
  - tuned-profiles-cpu-partitioning   # provides /usr/lib/tuned/functions helpers + variables file layout
  - irqbalance
  - grubby

# --- tuned profile ---------------------------------------------------------
amd_tuned_profile_name: amd-cpu-partitioning
amd_tuned_profile_include: network-latency
# Leave empty to auto-detect: /etc/tuned/profiles on tuned >= 2.23, else /etc/tuned
amd_tuned_profiles_dir: ""
amd_tuned_variables_conf_path: /etc/tuned/cpu-partitioning-variables.conf

# Kernel command line assembled by the tuned [bootloader] plugin (Section 3.3).
# ${...} tokens are tuned variables and are expanded by tuned, not Ansible.
amd_tuned_cmdline_base:
  - nohz=on
  - "${cmd_isolcpus}"
  - "nohz_full=${isolated_cores}"
  - "rcu_nocbs=${isolated_cores}"
  - rcu_nocb_poll
  - "tuned.non_isolcpus=${not_isolated_cpumask}"
  - processor.max_cstate=0
  - amd_pstate=passive
  - mce=ignore_ce
  - nowatchdog
  - nosoftlockup
  - nmi_watchdog=0
  - transparent_hugepage=never
  - pcie_aspm=off
  - audit=0
  - amd_iommu=off
  - iommu=off
  - iomem=relaxed
  - nomodeset
# Security trade-offs called out in the guide; opt in explicitly.
amd_tuned_cmdline_disable_mitigations: false   # adds mitigations=off
amd_tuned_cmdline_disable_selinux: false       # adds selinux=0
# Anything else you want appended to the command line.
amd_tuned_cmdline_extra: []

# sysctl settings applied by the tuned [sysctl] plugin (Section 3.3).
amd_tuned_sysctl_settings:
  vm.nr_hugepages: 5000
  kernel.hung_task_timeout_secs: 600
  kernel.numa_balancing: 0
  kernel.timer_migration: 1
  kernel.sched_autogroup_enabled: 0
  vm.stat_interval: 300
  vm.swappiness: 0
  vm.zone_reclaim_mode: 0
  vm.min_free_kbytes: 1024000
# Merged over amd_tuned_sysctl_settings; handy for per-group tweaks.
amd_tuned_sysctl_overrides: {}

# Network sysctls (Section 3.5). Shipped commented-out in the profile unless enabled;
# the guide recommends analysing your workload (and Onload/TCPDirect/ef_vi use) first.
amd_tuned_network_sysctl_enabled: false
amd_tuned_network_sysctl_settings:
  net.core.netdev_max_backlog: 10000
  net.core.optmem_max: 524288
  net.core.rmem_default: 1048576
  net.core.rmem_max: 33554432
  net.core.wmem_default: 1048576
  net.core.wmem_max: 33554432
  net.ipv4.tcp_slow_start_after_idle: 0
  net.ipv4.tcp_rmem: "4096 1048576 16777216"
  net.ipv4.tcp_wmem: "4096 1048576 16777216"

# Extra shell commands run from the profile's script.sh start() (Section 3.6).
amd_tuned_script_start_commands: []
# Extra shell commands run from script.sh stop() on full rollback.
amd_tuned_script_stop_commands: []

# --- irqbalance ------------------------------------------------------------
amd_irqbalance_sysconfig_path: /etc/sysconfig/irqbalance

# --- Solarflare X4 (Section 3.4 / Chapter 4) -------------------------------
# Cores to steer NIC RSS IRQs onto (e.g. "40-41"); empty = let sfcaffinity_config choose.
amd_solarflare_affinity_cores: ""
# Optional: reduce RSS channel count via modprobe (e.g. 4). Empty = driver default.
amd_solarflare_rss_cpus: ""
amd_solarflare_sfcaffinity_bin: /usr/sbin/sfcaffinity_config

# --- cpupower frequency profiles (Section 2.4) -----------------------------
# Example: cap housekeeping cores while isolated cores keep boosting.
# amd_cpufreq_profiles:
#   - { cpus: "0,1,12,13", min: "2.4GHz", max: "3.3GHz" }
#   - { cpus: "2-11,14-23", governor: "performance" }
amd_cpufreq_service_path: /etc/systemd/system/amd-cpufreq.service
amd_cpufreq_script_path: /usr/local/sbin/amd_cpufreq.sh

# --- resctrl / CAT (Section 2.6) -------------------------------------------
# Example from the guide (Turin 9575F, 16-way L3, first CCD split 50/50):
# amd_resctrl_groups:
#   - { name: ccd0_cos0, schemata: "L3:0=00ff", cpus: "0-1" }
#   - { name: ccd0_cos1, schemata: "L3:0=ff00", cpus: "2-7" }
amd_resctrl_mount: /sys/fs/resctrl
amd_resctrl_service_path: /etc/systemd/system/amd-resctrl.service
amd_resctrl_script_path: /usr/local/sbin/amd_resctrl.sh
