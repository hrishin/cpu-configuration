---
# ---------------------------------------------------------------------------
# Role switches (site.yml)
# ---------------------------------------------------------------------------
install_dependencies_enabled: true   # libbpf-tools, bpftrace, trace-cmd, perf, kernel-tools, hwloc, sysjitter
amd_low_latency_enabled: true        # AMD pub 73314 tuned profile + irqbalance, cpufreq, resctrl
housekeeping_enabled: true           # legacy pin scripts / service (grubby + sysctl.d paths off by default)

# ---------------------------------------------------------------------------
# CPU layout - single source of truth, mapped into each role below.
# isolated_cores: CPUs handed to latency-sensitive threads (nohz_full, rcu_nocbs, isolcpus).
# no_balance_cores: subset that also leaves the scheduler domains ("" to skip isolcpus=).
# hk_cpus: everything else; used by the pin scripts and the irqaffinity= fallback.
# Keep the isolated set inside one CCD/NUMA node local to the NIC (guide 2.2, 2.6).
# ---------------------------------------------------------------------------
isolated_cores: "2-11,14-23"
no_balance_cores: "{{ isolated_cores }}"
hk_cpus: "0,1,12,13"

amd_low_latency_isolated_cores: "{{ isolated_cores }}"
amd_low_latency_no_balance_cores: "{{ no_balance_cores }}"
housekeeping_isolated_cores: "{{ isolated_cores }}"
housekeeping_no_balance_cores: "{{ no_balance_cores }}"
housekeeping_cpus: "{{ hk_cpus }}"

# ---------------------------------------------------------------------------
# amd_low_latency - see roles/amd_low_latency/defaults/main.yml for every knob.
# The tuned profile owns the kernel command line, sysctls, workqueue/irqbalance
# masks and systemd CPU affinity. A reboot is required after first activation.
# ---------------------------------------------------------------------------
amd_low_latency_tuned_profile_enabled: true
amd_low_latency_irqbalance_oneshot: true
amd_low_latency_reboot_after_apply: false

# Security trade-offs the guide leaves to you (adds mitigations=off / selinux=0).
amd_low_latency_tuned_cmdline_disable_mitigations: false
amd_low_latency_tuned_cmdline_disable_selinux: false

# Kernel network buffer sysctls (guide 3.5) - off unless your workload needs them.
amd_low_latency_tuned_network_sysctl_enabled: false

# Solarflare X4 (guide 3.4 / ch. 4): steer RSS IRQs from the tuned script agent.
amd_low_latency_solarflare_affinity_enabled: false
amd_low_latency_solarflare_affinity_cores: ""
amd_low_latency_solarflare_rss_cpus: ""

# Per-core frequency limits via cpupower (guide 2.4). Example:
# amd_low_latency_cpufreq_profiles:
#   - { cpus: "{{ hk_cpus }}", min: "2.4GHz", max: "3.3GHz" }
#   - { cpus: "{{ isolated_cores }}", governor: "performance" }
amd_low_latency_cpufreq_profiles: []

# L3 cache allocation via resctrl (guide 2.6). Example:
# amd_low_latency_resctrl_groups:
#   - { name: ccd0_cos0, schemata: "L3:0=00ff", cpus: "0-1" }
#   - { name: ccd0_cos1, schemata: "L3:0=ff00", cpus: "2-7" }
amd_low_latency_resctrl_groups: []

# ---------------------------------------------------------------------------
# housekeeping - legacy pre-tuned path. tuned now owns boot args and sysctls,
# so those two parts default to off to avoid duplicate/conflicting cmdline
# entries. Enable them only when amd_low_latency_tuned_profile_enabled is false.
# ---------------------------------------------------------------------------
housekeeping_boot_args_enabled: false
housekeeping_sysctl_enabled: false
housekeeping_scripts_enabled: true
housekeeping_service_enabled: true
