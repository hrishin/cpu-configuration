---
# Role enable/disable flags
# Set to true to apply the role, false to skip it

# Install dependencies role - installs libbpf-tools, bpftrace, trace-cmd, sysjitter
install_dependencies_enabled: true

# Set to true to ignore package installation errors (packages will be skipped if unavailable)
ignore_package_errors: false

# Configure housekeeping role - configures kernel boot args, sysctl, scripts, service
configure_housekeeping_enabled: true

# Individual component flags for configure-housekeeping role
# Set to true/false to control specific parts of the housekeeping configuration
configure_housekeeping_kernel_boot_args: true
configure_housekeeping_sysctl: true
configure_housekeeping_scripts: true
configure_housekeeping_service: true

# Paths for scripts and service file
pin_housekeeping_script_path: /usr/local/sbin/pin_housekeeping.sh
set_irq_affinity_script_path: /usr/local/sbin/set_irq_affinity.sh
trace_jitter_script_path: /usr/local/bin/trace_jitter.sh
systemd_service_path: /etc/systemd/system/pin-housekeeping.service

# Default boot parameters
default_boot_params: "crashkernel=auto rashkernel=auto biosdevname=1 net.ifnames=0 quiet LANG=en_US.UTF-8 transparent_hugepage=never elevator=deadline nosoftlockup mce=ignore_ce ipv6.disable=1 printk.time audit=1 isolcpus=domain,nohz,managed_irq,2-11,14-23 nohz_full=2-11,14-23 rcu_nocbs=2-11,14-23 irqaffinity=0,1,12,13 mitigations=off maxcpus=24 nosmt tsc=reliable nmi_watchdog=0 watchdog=0 intel_idle.max_cstate=1 processor.max_cstate=1 skew_tick=1 intel_pstate=passive idle=halt"

# Optional: Override boot args if needed (otherwise captured from target, or uses default_boot_params)
kernel_boot_args: ""

# Default sysctl settings
default_sysctl_settings:
  kernel.numa_balancing: 0
  kernel.sched_rt_runtime_us: -1
  kernel.timer_migration: 0
  kernel.soft_watchdog: 0
  vm.stat_interval: 60

# Optional: Override sysctl settings if needed (otherwise uses default_sysctl_settings)
sysctl_settings: {}

# Housekeeping CPUs configuration
hk_cpus: "0,1,12,13"

# Isolated CPUs range for trace_jitter.sh (default: 2-7, can be overridden)
isolated_cpu_start: 2
isolated_cpu_end: 7
